        <div id="map">

        <script>
        var map = L.map('map', {
            zoomControl:false, maxZoom:28, minZoom:1
        }).fitBounds([[4.224826814423224,100.82381279282782],[4.797544296262424,101.71735426279209]]);
        var hash = new L.Hash(map);
        map.attributionControl.setPrefix('<a href="https://github.com/qgis2web/qgis2web" target="_blank">qgis2web</a> &middot; <a href="https://leafletjs.com" title="A JS library for interactive maps">Leaflet</a> &middot; <a href="https://qgis.org">QGIS</a>');
        var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});
        // remove popup's row if "visible-with-data"
        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }
        // modify popup if contains media
        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    var img = popup._contentNode.querySelector('td img');
                    if (img) {
                        // If already loaded (cache), update immediately
                        if (img.complete && img.naturalHeight > 0) {
                            popup.update();
                        } else {
                            img.addEventListener('load', function() {
                                popup.update();
                            });
                            img.addEventListener('error', function() {
                                popup.update();
                            });
                        }
                    }
                } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                    var audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = src;
                    imgTd.parentNode.replaceChild(audio, imgTd);
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
                    var video = document.createElement('video');
                    video.controls = true;
                    video.src = src;
                    video.style.width = "400px";
                    video.style.height = "300px";
                    video.style.maxHeight = "60vh";
                    video.style.maxWidth = "60vw";
                    imgTd.parentNode.replaceChild(video, imgTd);
                    popup._contentNode.classList.add('media');
                    // Aggiorna il popup quando il video carica i metadati
                    video.addEventListener('loadedmetadata', function() {
                        popup.update();
                    });
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else {
                    popup._contentNode.classList.remove('media');
                }
            } else {
                popup._contentNode.classList.remove('media');
            }
        }
        var zoomControl = L.control.zoom({
            position: 'topleft'
        }).addTo(map);
        L.control.locate({locateOptions: {maxZoom: 19}}).addTo(map);
        var bounds_group = new L.featureGroup([]);
        function setBounds() {
        }
        map.createPane('pane_GoogleSatelliteHybrid_0');
        map.getPane('pane_GoogleSatelliteHybrid_0').style.zIndex = 400;
        var layer_GoogleSatelliteHybrid_0 = L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
            pane: 'pane_GoogleSatelliteHybrid_0',
            opacity: 1.0,
            attribution: '',
            minZoom: 1,
            maxZoom: 28,
        });
        layer_GoogleSatelliteHybrid_0;
        map.addLayer(layer_GoogleSatelliteHybrid_0);
        map.createPane('pane_elvtry_1');
        map.getPane('pane_elvtry_1').style.zIndex = 401;
        var img_elvtry_1 = 'data/elvtry_1.png';
        var img_bounds_elvtry_1 = [[4.240390536757088,100.94326908194488],[4.786241592406233,101.38598350995113]];
        var layer_elvtry_1 = new L.imageOverlay(img_elvtry_1,
                                              img_bounds_elvtry_1,
                                              {pane: 'pane_elvtry_1'});
        bounds_group.addLayer(layer_elvtry_1);
        map.addLayer(layer_elvtry_1);
        setBounds();
        L.ImageOverlay.include({
            getBounds: function () {
                return this._bounds;
            }
        });
        </script>
        <!-- KOD LEGEND ELEVATION (TAMBAH DI SINI) -->
<script>
    window.addEventListener('load', function() {
        // Mencari pembolehubah peta Leaflet (biasanya dipanggil 'map')
        if (typeof map !== 'undefined') {
            var elevationLegend = L.control({ position: 'bottomright' }); // Boleh tukar 'bottomleft' jika mahu di kiri bawah

            elevationLegend.onAdd = function (map) {
                var div = L.DomUtil.create('div', 'info legend');
                
                // Styling Kotak Legend
                div.style.backgroundColor = 'rgba(255, 255, 255, 0.95)';
                div.style.padding = '10px 14px';
                div.style.borderRadius = '8px';
                div.style.boxShadow = '0 2px 6px rgba(0,0,0,0.3)';
                div.style.fontFamily = 'Arial, sans-serif';
                div.style.fontSize = '12px';
                div.style.lineHeight = '1.8';
                div.style.color = '#333';

                // Kandungan Legend
                div.innerHTML = `
                    <b style="display:block; margin-bottom: 6px; font-weight:bold; font-size: 13px; color: #111;">Elevation</b>
                    <div style="display:flex; align-items:center; gap:8px;">
                        <span style="width:16px; height:16px; background-color:#1b8a34; border:1px solid #ccc; display:inline-block; border-radius:3px;"></span> <400M Very Low
                    </div>
                    <div style="display:flex; align-items:center; gap:8px;">
                        <span style="width:16px; height:16px; background-color:#a1d96b; border:1px solid #ccc; display:inline-block; border-radius:3px;"></span> 400M-800M Low
                    </div>
                    <div style="display:flex; align-items:center; gap:8px;">
                        <span style="width:16px; height:16px; background-color:#ffffbe; border:1px solid #ccc; display:inline-block; border-radius:3px;"></span> 800M-1200M Moderate
                    </div>
                    <div style="display:flex; align-items:center; gap:8px;">
                        <span style="width:16px; height:16px; background-color:#fdae61; border:1px solid #ccc; display:inline-block; border-radius:3px;"></span> 1200M-1600M High
                    </div>
                    <div style="display:flex; align-items:center; gap:8px;">
                        <span style="width:16px; height:16px; background-color:#d7191c; border:1px solid #ccc; display:inline-block; border-radius:3px;"></span> >1600M Very High
                    </div>
                `;
                return div;
            };

            elevationLegend.addTo(map);
        }
    });
</script>
